name: Bug report
description: Report reproducible incorrect behavior in Core Metrics.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Do not include credentials, signing information, personal paths, device names, or sensitive logs.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
      placeholder: A concise description of the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence that triggers the problem.
      placeholder: |
        1. Launch Core Metrics
        2. Open …
        3. Select …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 27.0
    validations:
      required: true
  - type: input
    id: xcode
    attributes:
      label: Xcode version (for build or test problems)
      placeholder: Xcode 27 beta 6
  - type: input
    id: build
    attributes:
      label: Core Metrics revision or build
      placeholder: Commit hash or build identifier
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add redacted logs or screenshots if they help explain the issue.
